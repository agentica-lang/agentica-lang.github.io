name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same pins as the agentica docs (agentica/.github/workflows/pages.yml) and the docs theme.
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      DART_SASS_VERSION: 1.105.1
      DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0
      - name: Install Hugo and Dart Sass
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c
          tar -xzf hugo.tar.gz -C bin hugo
          curl -fsSLo sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  sass.tar.gz" | sha256sum -c
          tar -xzf sass.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - run: hugo version
      - run: hugo --gc --panicOnWarning
      # The theme's highlighter colors the agentica blocks, which Hugo leaves to the Ruby lexer. It fails on a build with
      # no agentica block, and most pages have none, so it runs only when a page has one.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: themes/docs-theme/highlight/package-lock.json
      - name: Color the agentica code blocks
        run: |
          if grep -rqE 'class="?agc-code' public; then
            npm ci --prefix themes/docs-theme/highlight --ignore-scripts --no-audit --no-fund
            node themes/docs-theme/highlight/highlight.mjs public
          else
            echo "no agentica code blocks"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
