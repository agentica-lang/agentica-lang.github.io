# The links of the sidebar, after Home. `name_es` is the Spanish name; a `url` of this site (such as /ecosystem/) goes to
# its Spanish page on /es/ when that page exists.
nav:
  - name: Documentation
    name_es: Documentación
    url: /agentica/
  - name: Library
    name_es: Biblioteca
    url: /agentica/library/
  - name: Blog
    name_es: Blog
    url: /blog/
  - name: Ecosystem
    name_es: Ecosistema
    url: /ecosystem/
  - name: Team
    name_es: Equipo
    url: /team/
  - name: GitHub
    name_es: GitHub
    url: https://github.com/agentica-lang
# The repos with a project site at /<repo>/: /sitemap.xml lists each one's sitemap.
sites:
  - agentica
  - bond
  - agentica-db
  - packages
  - cchecker
  - agentica-tui
  - agc-agent
# The project sites that publish an llms.txt: the "Projects" group of /llms.txt links each one.
llms:
  - agentica
  - packages
  - cchecker
  - agentica-tui
  - agc-agent
  - bond
  - agentica-db
