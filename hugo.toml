# The look, the layouts and the outputs come from the docs theme (themes/docs-theme), as on the docs sites.
_merge = "deep"
baseURL = "https://www.agentica-lang.com/"
theme = "docs-theme"
enableRobotsTXT = true
# The sitemap dates each page by its last commit (pages.yml checks out the whole history).
enableGitInfo = true
# Tag pages keep the tag as written ("agentica-db", not "Agentica-Db").
capitalizeListTitles = false
# English at the root, Spanish under /es/. Each language has its own content mount below.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages.en]
label = "English"
locale = "en"
contentDir = "content"
title = "Agentica"
weight = 1

[languages.en.params]
  ogLocale = "en_US"

[languages.es]
label = "Español"
locale = "es"
# The Spanish pages: the same paths as content/, only the home and the ecosystem page.
contentDir = "content.es"
title = "Agentica"
weight = 2
disableKinds = ["taxonomy", "term"]

[languages.es.params]
  ogLocale = "es_ES"
  description = "Agentica es Ruby con tipos estáticos: sintaxis parecida a Ruby, comprobada antes de ejecutar, con valores inmutables."
  tagline = "Ruby con tipos estáticos"
  socialImageAlt = "Agentica: Ruby con tipos estáticos"

# The Spanish site has no tag pages (the blog is English only) and no feed or sitemap index (those are the English site's).
[languages.es.outputs]
  home = ["html", "markdown", "search", "llms", "llmsfull"]

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  tagline = "Ruby with static types"
  repo = "https://github.com/agentica-lang"
  repoPublic = true
  # The large link card of every page with no image of its own (tools/social-image.sh makes it).
  socialImage = "/social.png"
  socialImageAlt = "Agentica: Ruby with static types"
  # Every page links the blog feed (_partials/favicon.html), not its own or the root feed.
  feedLink = false

  # The SoftwareSourceCode node of the home page's JSON-LD.
  [params.software]
    codeRepository = "https://github.com/agentica-lang/agentica"
    programmingLanguage = "Agentica"
    license = "https://github.com/agentica-lang/agentica/blob/master/LICENSE"

# Tag pages are lists of posts: search engines index the posts, not the lists.
[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.target]
    kind = "{taxonomy,term}"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss", "markdown", "search", "llms", "llmsfull", "sitemapindex"]
  section = ["html", "rss", "markdown"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[services.rss]
  limit = 20

# /sitemap.xml is an index of this site's sitemap and the sitemaps of the project sites (data/projects.yaml).
[sitemap]
  changeFreq = "weekly"
  filename = "sitemap-home.xml"

[outputFormats.sitemapindex]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = true
  root = true

[module.hugoVersion]
  extended = true
  min = "0.167.0"
