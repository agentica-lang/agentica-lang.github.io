# The look, the layouts and the outputs come from the docs theme (themes/docs-theme), as on the docs sites.
_merge = "deep"
baseURL = "https://www.agentica-lang.com/"
locale = "en"
title = "Agentica"
theme = "docs-theme"
enableRobotsTXT = true
# The sitemap dates each page by its last commit (pages.yml checks out the whole history).
enableGitInfo = true

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  tagline = "Ruby with static types"
  repo = "https://github.com/agentica-lang"
  repoPublic = true
  # The large link card of every page with no image of its own (tools/social-image.sh makes it).
  socialImage = "/social.png"
  socialImageAlt = "Agentica: Ruby with static types"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss", "markdown", "search", "llms", "llmsfull", "sitemapindex"]
  section = ["html", "rss", "markdown"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[services.rss]
  limit = 20

# /sitemap.xml is an index of this site's sitemap and the sitemaps of the project sites (data/projects.yaml).
[sitemap]
  changeFreq = "weekly"
  filename = "sitemap-home.xml"

[outputFormats.sitemapindex]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = true
  root = true

[module.hugoVersion]
  extended = true
  min = "0.167.0"
