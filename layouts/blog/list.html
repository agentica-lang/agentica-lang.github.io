{{ define "main" }}
<article class="content">
  {{- partial "breadcrumbs.html" . }}
  <div class="page-head"><h1>{{ .Title }}</h1></div>
  {{ .Content }}
  {{ partial "post-list.html" .Pages.ByDate.Reverse }}
  <p><a href="{{ "tags/" | relURL }}">Tags</a> · <a href="{{ "blog/index.xml" | relURL }}">RSS</a></p>
</article>
{{ end }}
