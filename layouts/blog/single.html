{{ define "main" }}
<article class="content">
  {{- partial "breadcrumbs.html" . }}
  <div class="page-head"><h1>{{ .Title }}</h1>{{ partial "page-actions.html" . }}</div>
  <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  {{- with .GetTerms "tags" }} · {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a href="{{ $t.RelPermalink }}">{{ $t.LinkTitle }}</a>{{ end }}{{ end }}</p>
  {{ .Content }}
</article>
{{ end }}
